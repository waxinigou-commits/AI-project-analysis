name: Daily product intelligence

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect and analyze launches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: openai/gpt-4.1-mini
        run: python3 scripts/collect.py
      - name: Persist new intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/products.json data/products.db
          git diff --cached --quiet || git commit -m "data: refresh AI product intelligence"
          git push
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build refreshed site
        run: npm install && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy refreshed site
        uses: actions/deploy-pages@v4
